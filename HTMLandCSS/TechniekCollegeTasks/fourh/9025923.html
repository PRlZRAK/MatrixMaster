<!doctype html>
<html lang="en">
  <head>
    <style>
      html {
        background-color: #d2f4ff;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulieren</title>
  </head>
  <body>
    <form>
      <div>
        <label for="jouwNaam">Schrijf jouw naam</label>
        <input type="text" id="jouwNaam" required />
        <hr />
      </div>
    </form>
    <form>
      <div>
        <label for="gender">Kies jouw gender:</label>
        <select name="gender" id="gender">
          <option value="m">M</option>
          <option value="v">V</option>
          <option value="anders">Anders</option>
        </select>
      </div>

      <hr />
    </form>
    <form>
      <p>Hoe ga je naar college?</p>
      <input type="checkbox" id="fiets" name="fiets" value="Fiets" />
      <label for="fiets">Bij fiets</label><br />
      <input type="checkbox" id="auto" name="auto" value="Auto" />
      <label for="auto">Bij auto</label><br />
      <input type="checkbox" id="voet" name="voet" value="Voet" />
      <label for="voet">Bij voet</label><br /><br />
    </form>
    <hr />

    <form>
      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        minlength="8"
        required
      /><br /><br />
    </form>
    <hr />
    <div>
      <input type="submit" value="Submit" />
    </div>
  </body>
</html>
